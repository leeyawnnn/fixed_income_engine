name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Third-party actions are pinned to commit SHAs, not tags: a tag can be moved,
# a commit cannot.
env:
  CHECKOUT: actions/checkout@11d5960a326750d5838078e36cf38b85af677262      # v4.2.2
  SETUP_PY: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        exclude:
          # On macOS runners `gcc` is a shim for Apple clang, so this cell would
          # duplicate the clang cell rather than test a second toolchain.
          - os: macos-latest
            compiler: gcc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Eigen (satisfies find_package, skips the download)
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libeigen3-dev
          else
            brew install eigen
          fi

      - name: Cache fetched dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.2.3
        with:
          path: build/_deps
          key: deps-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc"  >> "$GITHUB_ENV"
            echo "CXX=g++"  >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DFI_WERROR=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 60

      - name: Run the demo end to end
        run: ./build/curve_demo --quotes data/swap_rates.csv --portfolio data/portfolio.json

  offline-build:
    name: offline build (no network fetch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo apt-get update && sudo apt-get install -y libeigen3-dev catch2

      # FI_OFFLINE=ON must fail configure rather than silently reaching for the
      # network, so this job proves the documented offline path really works
      # against system-installed dependencies only.
      - name: Configure offline
        run: cmake -S . -B build -DFI_OFFLINE=ON -DFI_WERROR=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 60

  sanitizers:
    name: sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address-undefined, thread]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

      - name: Configure
        run: |
          if [ "${{ matrix.sanitizer }}" = "address-undefined" ]; then
            FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          else
            FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="$FLAGS" -DCMAKE_EXE_LINKER_FLAGS="$FLAGS"
        env:
          CC: clang
          CXX: clang++

      - run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check formatting
        run: |
          clang-format --version
          git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror

  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo apt-get update && sudo apt-get install -y libeigen3-dev clang-tidy

      # clang-tidy needs the real compile commands, and the tests' generated
      # Catch2 headers must exist before it parses tests/*.cpp.
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build -j

      - name: Run clang-tidy
        run: git ls-files 'src/*.cpp' 'apps/*.cpp' 'tests/*.cpp' | xargs clang-tidy -p build
