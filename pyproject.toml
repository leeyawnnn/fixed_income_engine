# Configuration for the Python tooling under scripts/ and tools/ only. The
# engine itself is C++; there is no Python package here to build or install.
[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ISC", "DTZ", "EXE", "RUF"]

[tool.ruff.format]
quote-style = "double"
