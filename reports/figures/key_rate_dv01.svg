    <text style="fill: #6b6b6b; font: italic 9px 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start" x="93.6576" y="448.1865" transform="rotate(-0 93.6576 448.1865)">10 of 13 buckets carry under $100/bp and are left unlabelled</text>
   </g>
  </g>
  <g id="text_27">
   <text style="fill: #1a1a1a; font: 600 15px 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start" x="86.4" y="24.3" transform="rotate(-0 86.4 24.3)">The risk is a 5s10s curve position, not a duration view</text>
  </g>
  <g id="text_28">
   <text style="fill: #6b6b6b; font: 11px 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start" x="86.4" y="45.9" transform="rotate(-0 86.4 45.9)">Key-rate DV01 by curve node, 2025-12-31 · $10mm 5Y payer at 4.00% and $5mm 10Y receiver at 4.50% · hatched bars lose when that tenor rises</text>
  </g>
  <g id="text_29">
   <text style="fill: #6b6b6b; font: italic 8px 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start" x="86.4" y="528.12" transform="rotate(-0 86.4 528.12)">Source: US Treasury Daily Par Yield Curve Rates (CMT), as of 2025-12-31. Computed by fi_report from data/treasury_par_yields_2025.csv.</text>
  </g>
